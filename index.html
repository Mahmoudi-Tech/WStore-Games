<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WStore Games PRO++</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <div class="brand">
    <img src="logo.png" class="logo">
    <h2>WStore Games</h2>
  </div>

  <!-- زر الموبايل -->
  <div class="menu-toggle" onclick="toggleMenu()">☰</div>

  <nav id="nav">
    <a href="#home">الرئيسية</a>
    <a href="#download">تحميل</a>
  </nav>

</header>

<!-- HERO -->
<section class="hero" id="home">

  <div class="app-box">
    <img src="logo.png" class="app-icon">

    <h1>WStore Games</h1>

    <p>🎮 منصة شحن الألعاب الأسرع والأكثر أمانًا</p>

    <div class="rating">
      ⭐⭐⭐⭐⭐ <span>(4.9)</span>
    </div>

    <div class="counter">
      🔥 عدد التحميلات: <span id="count">0</span>
    </div>

    <a class="btn" onclick="downloadApp()">⬇️ تحميل التطبيق</a>
  </div>

</section>

<!-- FEATURES -->
<section class="features">

  <div class="card">⚡ شحن فوري<br><small>تنفيذ في ثواني</small></div>
  <div class="card">🔒 أمان عالي<br><small>حماية كاملة</small></div>
  <div class="card">🎮 كل الألعاب<br><small>PUBG - FF - COD</small></div>

</section>

<footer>
© 2026 WStore Games - All Rights Reserved
</footer>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// 🔥 ضع بيانات Firebase هنا
const firebaseConfig = {
  apiKey: "AIzaSyA8zbwD7QNk-GeNA4x-MWKLuLhcrV8OtgI",
  authDomain: "wstore-games-site.firebaseapp.com",
  databaseURL: "https://wstore-games-site-default-rtdb.firebaseio.com",
  projectId: "wstore-games-site",
  storageBucket: "wstore-games-site.firebasestorage.app",
  messagingSenderId: "422122681134",
  appId: "1:422122681134:web:0036b85a274996c49000bf",
//  measurementId: "G-EW3CKE4M6L"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const counterRef = ref(db, "downloads");

// Live Counter
onValue(counterRef, (snapshot) => {
  document.getElementById("count").innerText = snapshot.val() || 0;
});

// Download function
window.downloadApp = async function () {
  const snap = await get(counterRef);
  let count = snap.val() || 0;

  await set(counterRef, count + 1);

  window.location.href = "https://github.com/Mahmoudi-Tech/WStore-Games/releases/download/WStore-Games/WStore.Games.apk";
};
</script>

</body>
</html>
