<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Witcher Store Games | شحن الألعاب أونلاين</title>
    
    <!-- أيقونة الموقع -->
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="shortcut icon" href="logo.png">
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Tajawal Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        /* ========== المتغيرات ========== */
        :root {
            --bg-primary: #0a0f1e;
            --bg-secondary: #0c1225;
            --bg-card: rgba(15, 25, 45, 0.85);
            --bg-card-solid: #0d142c;
            --bg-card-hover: rgba(10, 20, 40, 0.9);
            --bg-input: rgba(10, 20, 35, 0.8);
            --text-primary: #eef5ff;
            --text-secondary: #b9c7e3;
            --text-muted: #a0b3d9;
            --border-color: rgba(190, 238, 17, 0.3);
            --border-hover: rgba(190, 238, 17, 0.6);
            --shadow-color: rgba(190, 238, 17, 0.2);
            --accent: #BEEE11;
            --accent-dark: #9ed10e;
            --header-bg: rgba(10, 15, 30, 0.92);
            --toast-bg: #1f2a3e;
            --launch-bg: rgba(190, 238, 17, 0.12);
            --warning-bg: rgba(255, 100, 100, 0.15);
            --warning-border: rgba(255, 100, 100, 0.5);
            --transition-speed: 0.5s;
            --app-mock-bg: #111827;
        }

        /* ========== الوضع النهاري ========== */
        [data-theme="light"] {
            --bg-primary: #e8edf8;
            --bg-secondary: #d5ddee;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-card-solid: #f0f4ff;
            --bg-card-hover: rgba(240, 245, 255, 0.95);
            --bg-input: rgba(255, 255, 255, 0.9);
            --text-primary: #1a1f2e;
            --text-secondary: #3a4055;
            --text-muted: #5a6075;
            --border-color: rgba(190, 238, 17, 0.5);
            --border-hover: rgba(190, 238, 17, 0.8);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --header-bg: rgba(232, 237, 248, 0.95);
            --toast-bg: #ffffff;
            --launch-bg: rgba(190, 238, 17, 0.2);
            --warning-bg: rgba(255, 200, 200, 0.3);
            --warning-border: rgba(255, 100, 100, 0.7);
            --app-mock-bg: #e0e5f0;
        }

        /* ========== إعادة تعيين ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color var(--transition-speed) ease,
                        color var(--transition-speed) ease,
                        border-color var(--transition-speed) ease,
                        box-shadow var(--transition-speed) ease;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* ========== أنيميشنات ========== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(60px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-60px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(60px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(190, 238, 17, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(190, 238, 17, 0); }
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px rgba(190, 238, 17, 0.3); }
            50% { text-shadow: 0 0 30px rgba(190, 238, 17, 0.8); }
        }
        
        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes borderFlow {
            0%, 100% { border-color: rgba(190, 238, 17, 0.3); box-shadow: 0 0 0 0 rgba(190, 238, 17, 0.2); }
            50% { border-color: rgba(190, 238, 17, 0.8); box-shadow: 0 0 30px rgba(190, 238, 17, 0.4); }
        }
        
        @keyframes successPop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-pulse { animation: pulse 2s ease-in-out infinite; }
        .animate-glow { animation: glow 3s ease-in-out infinite; }
        
        html { scroll-behavior: smooth; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-dark); }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px;
        }
        
        /* ========== زر الوضع ========== */
        .theme-toggle {
            position: fixed;
            bottom: 90px;
            right: 25px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #0a0f1e;
            font-size: 24px;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 5px 20px rgba(190, 238, 17, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .theme-toggle:hover {
            transform: scale(1.1) rotate(20deg);
            box-shadow: 0 10px 30px rgba(190, 238, 17, 0.6);
        }
        
        .theme-toggle i {
            transition: transform 0.5s ease;
        }
        
        .theme-toggle:hover i {
            transform: rotate(180deg);
        }
        
        /* ========== الهيدر ========== */
        header {
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 0;
        }
        
        .header-flex {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        
        .logo-img {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #11171f, #0f172a);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(190, 238, 17, 0.3);
            overflow: hidden;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        
        .logo-img:hover {
            transform: scale(1.05);
        }
        
        .logo-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .logo-text h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary), var(--accent), #e6ff4d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .logo-text p {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--accent);
            padding: 8px 18px;
            border-radius: 40px;
            color: var(--text-primary);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 14px;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }
        
        .btn-outline::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(190, 238, 17, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn-outline:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-outline:hover {
            background: rgba(190, 238, 17, 0.15);
            border-color: var(--accent-dark);
            transform: translateY(-2px);
        }
        
        /* ========== الهيرو ========== */
        .hero {
            padding: 60px 0 40px;
            text-align: center;
        }
        
        .hero h2 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary), var(--accent), #e6ff4d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        
        .hero p {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto 30px;
        }
        
        .btn-primary {
            background: linear-gradient(95deg, var(--accent), var(--accent-dark));
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 700;
            color: #0a0f1e;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(190, 238, 17, 0.4);
            cursor: pointer;
            font-size: 16px;
            border: none;
        }
        
        .btn-primary:hover {
            transform: translateY(-4px);
            background: linear-gradient(95deg, #d4ff33, var(--accent));
            box-shadow: 0 15px 30px rgba(190, 238, 17, 0.5);
        }
        
        /* ========== قسم الإطلاق ========== */
        .launch-section {
            background: var(--launch-bg);
            border-radius: 40px;
            margin: 30px 0 50px;
            padding: 45px 30px;
            text-align: center;
            border: 2px solid rgba(190, 238, 17, 0.5);
            position: relative;
            overflow: hidden;
            animation: borderFlow 3s ease-in-out infinite;
        }
        
        .launch-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(190, 238, 17, 0.2);
            padding: 10px 28px;
            border-radius: 50px;
            margin-bottom: 20px;
            border: 1px solid rgba(190, 238, 17, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }
        
        .launch-badge i {
            font-size: 28px;
            color: var(--accent);
        }
        
        .launch-badge span {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
        }
        
        .launch-title {
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent), #e6ff4d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .launch-version {
            font-size: 52px;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(190, 238, 17, 0.4);
        }
        
        .launch-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .launch-subtitle i {
            color: var(--accent);
            margin: 0 5px;
        }
        
        .launch-features {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        
        .launch-feature {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-input);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .launch-feature i {
            color: var(--accent);
            font-size: 16px;
        }
        
        /* ========== طريقة الشحن ========== */
        .howto-section {
            background: var(--bg-card);
            border-radius: 40px;
            margin: 50px 0;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        
        .howto-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .howto-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 35px;
        }
        
        .howto-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }
        
        .howto-card {
            background: var(--bg-input);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }
        
        .howto-card:hover {
            transform: translateY(-8px);
            border-color: var(--border-hover);
            box-shadow: 0 15px 30px var(--shadow-color);
        }
        
        .howto-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(190, 238, 17, 0.15), rgba(190, 238, 17, 0.05));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
        }
        
        .howto-icon i {
            font-size: 35px;
            color: var(--accent);
        }
        
        .howto-card h4 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        
        .howto-card p {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 14px;
        }
        
        .time-badge {
            background: rgba(190, 238, 17, 0.15);
            border-radius: 50px;
            padding: 12px 25px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            border: 1px solid rgba(190, 238, 17, 0.4);
        }
        
        .time-badge i {
            font-size: 24px;
            color: var(--accent);
        }
        
        .time-badge span {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
        }
        
        .guarantee-note {
            background: rgba(190, 238, 17, 0.08);
            border-radius: 20px;
            padding: 20px;
            margin-top: 25px;
            text-align: center;
            border: 1px dashed rgba(190, 238, 17, 0.4);
        }
        
        .guarantee-note i {
            font-size: 28px;
            color: var(--accent);
            margin-bottom: 10px;
        }
        
        .guarantee-note p {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        /* ========== المميزات ========== */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 50px 0;
        }
        
        .feature-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.4s ease;
            border: 1px solid var(--border-color);
        }
        
        .feature-card:hover {
            transform: translateY(-10px);
            border-color: var(--border-hover);
            box-shadow: 0 15px 30px var(--shadow-color);
        }
        
        .feature-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(190, 238, 17, 0.15), rgba(190, 238, 17, 0.05));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
        }
        
        .feature-card:hover .feature-icon {
            transform: scale(1.1);
            background: rgba(190, 238, 17, 0.25);
        }
        
        .feature-icon i { font-size: 35px; color: var(--accent); }
        .feature-card h3 { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: var(--text-primary); }
        .feature-card p { color: var(--text-secondary); line-height: 1.6; font-size: 14px; }
        
        /* ========== التحديثات ========== */
        .update-section {
            background: var(--bg-card);
            border-radius: 40px;
            margin: 50px 0;
            overflow: hidden;
            border: 1px solid var(--border-color);
            animation: borderFlow 3s ease-in-out infinite;
        }
        
        .update-header {
            background: linear-gradient(135deg, rgba(190, 238, 17, 0.1), rgba(190, 238, 17, 0.02));
            padding: 30px 25px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        
        .version-badge {
            display: inline-flex;
            align
